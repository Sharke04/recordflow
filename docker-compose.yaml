services:
  postgres:
    image: postgres:18
    container_name: recordflow-source-db
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (see .env.example)}
      RECORDFLOW_PG_PASSWORD: ${RECORDFLOW_PG_PASSWORD:?set RECORDFLOW_PG_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - recordflow_pg_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the temporary server that runs the init scripts does not count.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: recordflow-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD in .env (see .env.example)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      RECORDFLOW_CH_PASSWORD: ${RECORDFLOW_CH_PASSWORD:?set RECORDFLOW_CH_PASSWORD in .env (see .env.example)}
      ANALYST_CH_PASSWORD: ${ANALYST_CH_PASSWORD:?set ANALYST_CH_PASSWORD in .env (see .env.example)}
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - recordflow_ch_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # As recordflow, so the check passes only after the init script created it.
      test: ["CMD-SHELL", "clickhouse-client --user recordflow --password \"$${RECORDFLOW_CH_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  recordflow:
    build: .
    image: recordflow:local
    container_name: recordflow
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      RECORDFLOW_SOURCE_CONNINFO: host=postgres port=5432 dbname=${POSTGRES_DB:-mydb} user=recordflow application_name=recordflow
      RECORDFLOW_SOURCE_SLOT: ${RECORDFLOW_SOURCE_SLOT:-recordflow_slot}
      RECORDFLOW_SOURCE_PUBLICATION: ${RECORDFLOW_SOURCE_PUBLICATION:-recordflow_pub}
      RECORDFLOW_SOURCE_TABLE: ${RECORDFLOW_SOURCE_TABLE:-public.orders}
      PGPASSWORD: ${RECORDFLOW_PG_PASSWORD:?set RECORDFLOW_PG_PASSWORD in .env (see .env.example)}
      RECORDFLOW_CLICKHOUSE_HOST: clickhouse
      RECORDFLOW_CLICKHOUSE_PASSWORD: ${RECORDFLOW_CH_PASSWORD:?set RECORDFLOW_CH_PASSWORD in .env (see .env.example)}
      # The vcpkg clickhouse-cpp build cannot checksum compressed blocks.
      RECORDFLOW_CLICKHOUSE_COMPRESSION: none
      RECORDFLOW_SNAPSHOT_ON_START: ${RECORDFLOW_SNAPSHOT_ON_START:-always}
      RECORDFLOW_LOG_LEVEL: ${RECORDFLOW_LOG_LEVEL:-info}
      RECORDFLOW_SHUTDOWN_TIMEOUT_S: 8
    volumes:
      - recordflow_data:/var/lib/recordflow
    # Longer than shutdown.timeout_s, so Docker never kills a clean shutdown.
    stop_grace_period: 10s
    # Exit codes 2-4 need an operator; on-failure gives up after 5 attempts.
    restart: on-failure:5

volumes:
  recordflow_pg_data:
  recordflow_ch_data:
  recordflow_data:
